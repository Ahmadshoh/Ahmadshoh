<svg xmlns="http://www.w3.org/2000/svg" width="820" height="192" viewBox="0 0 820 192" role="img" aria-labelledby="title desc">
  <title id="title">Currently focused on</title>
  <desc id="desc">Tijorat+: multi-tenant cloud ERP and POS. TijoratAI: LLM agents that work with real business data. Fleetdock: open-source control plane for self-hosted databases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .dot { animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .late { animation-delay: .7s; }
      .later { animation-delay: 1.4s; }
      @keyframes ping { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(3); opacity: 0; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="191" rx="14" fill="url(#bg)" stroke="#30363D"/>
  <text class="mono" x="28" y="34" font-size="13" fill="#8B949E">// currently focused on</text>

  <!-- Tijorat+ -->
  <circle class="dot" cx="38" cy="72" r="5" fill="#F59E0B"/>
  <circle cx="38" cy="72" r="5" fill="#F59E0B"/>
  <text x="56" y="78" font-size="18" font-weight="700" fill="#E6EDF3">Tijorat+</text>
  <text x="162" y="78" font-size="15" fill="#8B949E">multi-tenant cloud ERP &amp; POS on Frappe / ERPNext</text>
  <rect x="640" y="60" width="150" height="24" rx="12" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.5"/>
  <text class="mono" x="715" y="76" font-size="12" fill="#F59E0B" text-anchor="middle">in production</text>

  <!-- TijoratAI -->
  <circle class="dot late" cx="38" cy="114" r="5" fill="#A78BFA"/>
  <circle cx="38" cy="114" r="5" fill="#A78BFA"/>
  <text x="56" y="120" font-size="18" font-weight="700" fill="#E6EDF3">TijoratAI</text>
  <text x="162" y="120" font-size="15" fill="#8B949E">LLM agents on LangChain / LangGraph over real ERP data</text>
  <rect x="640" y="102" width="150" height="24" rx="12" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.5"/>
  <text class="mono" x="715" y="118" font-size="12" fill="#A78BFA" text-anchor="middle">building now</text>

  <!-- Fleetdock -->
  <circle class="dot later" cx="38" cy="156" r="5" fill="#22D3EE"/>
  <circle cx="38" cy="156" r="5" fill="#22D3EE"/>
  <text x="56" y="162" font-size="18" font-weight="700" fill="#E6EDF3">Fleetdock</text>
  <text x="162" y="162" font-size="15" fill="#8B949E">open-source control plane for MariaDB, MySQL &amp; PostgreSQL</text>
  <rect x="640" y="144" width="150" height="24" rx="12" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/>
  <text class="mono" x="715" y="160" font-size="12" fill="#22D3EE" text-anchor="middle">open source</text>
</svg>
